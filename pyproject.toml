[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dttools"
version = "0.2.0"
description = "A simple library for common date and time manipulations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Emmanuel Ademola", email = "ademola.emmanuel383@gmail.com" },
]
keywords = ["datetime", "date", "time", "business-days", "timezone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/ademola-emmanuel/dttools"
"Bug Tracker" = "https://github.com/ademola-emmanuel/dttools/issues"

[tool.setuptools.packages.find]
exclude = ["tests*"]
